services:
  pos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos-application
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # JWT Secret (change this in production!)
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      # Database configuration (uncomment if using Turso)
      # - TURSO_DATABASE_URL=${TURSO_DATABASE_URL}
      # - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN}
      # Or use local file database (default)
      - DATABASE_URL=file:///app/data/db/local.db
    volumes:
      # Mount local database as read-only source (for cloning)
      - ./data/db:/app/data/db-source:ro
      # Container's own database (isolated from local dev)
      - pos-db-data:/app/data/db
      # Optional: Mount .env.local if you have one
      # - ./.env.local:/app/.env.local:ro
    networks:
      - pos-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pos-db-data:
    driver: local
    name: pos-database

networks:
  pos-network:
    driver: bridge
